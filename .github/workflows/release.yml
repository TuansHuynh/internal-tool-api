name: Release

on:
  push:
    tags:
      - 'v*'

# Ensures only one release runs at a time per tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: internal-api-client
  GO_VERSION: '1.25'
  NODE_VERSION: '20'

jobs:
  # ── Build: Windows (main app + updater) ───────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content version.json | ConvertFrom-Json).version
          echo "version=$v" >> $env:GITHUB_OUTPUT
          echo "Version: $v"

      - name: Build updater (Windows)
        run: |
          New-Item -ItemType Directory -Force -Path internal/updater/bin | Out-Null
          go build -ldflags="-s -w" -o internal/updater/bin/updater.exe ./cmd/updater/
        shell: pwsh

      - name: Build main app (Windows)
        run: wails build -platform windows/amd64 -ldflags "-s -w"

      - name: Rename main binary
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          # Wails uses the outputfilename from wails.json
          Get-ChildItem build/bin/*.exe | Where-Object { $_.Name -ne 'updater.exe' } |
            Rename-Item -NewName "${{ env.APP_NAME }}-v$v.exe" -ErrorAction SilentlyContinue
          echo "Built: build/bin/${{ env.APP_NAME }}-v$v.exe"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            build/bin/${{ env.APP_NAME }}-v${{ steps.version.outputs.version }}.exe
            internal/updater/bin/updater.exe
          retention-days: 1

  # ── Build: Linux ──────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.0-dev \
            gcc pkg-config

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Read version
        id: version
        run: |
          VERSION=$(cat version.json | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build updater (Linux)
        run: |
          go build -ldflags="-s -w" -o internal/updater/bin/updater ./cmd/updater/

      - name: Build main app (Linux)
        run: wails build -platform linux/amd64 -ldflags "-s -w"

      - name: Rename main binary
        run: |
          V="${{ steps.version.outputs.version }}"
          find build/bin -maxdepth 1 -type f ! -name 'updater' \
            -exec mv {} "build/bin/${{ env.APP_NAME }}-v$V" \;
          chmod +x "build/bin/${{ env.APP_NAME }}-v$V"
          echo "Built: build/bin/${{ env.APP_NAME }}-v$V"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            build/bin/${{ env.APP_NAME }}-v${{ steps.version.outputs.version }}
            internal/updater/bin/updater
          retention-days: 1

  # ── Release: Publish GitHub Release with manifest ─────────────────────────
  release:
    name: Publish Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: dist/windows/

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: dist/linux/

      - name: Compute SHA-256 checksums
        id: sha
        run: |
          V="${{ needs.build-windows.outputs.version }}"
          APP="${{ env.APP_NAME }}"

          WIN_EXE="dist/windows/${APP}-v${V}.exe"
          LINUX_BIN="dist/linux/${APP}-v${V}"

          WIN_SHA=$(sha256sum "$WIN_EXE" | awk '{print $1}')
          LINUX_SHA=$(sha256sum "$LINUX_BIN" | awk '{print $1}')

          echo "win_sha=$WIN_SHA"   >> $GITHUB_OUTPUT
          echo "linux_sha=$LINUX_SHA" >> $GITHUB_OUTPUT
          echo "version=$V"         >> $GITHUB_OUTPUT

          echo "Windows SHA256:  $WIN_SHA"
          echo "Linux SHA256:    $LINUX_SHA"

      - name: Generate latest.json
        run: |
          V="${{ steps.sha.outputs.version }}"
          APP="${{ env.APP_NAME }}"
          REPO="TuansHuynh/internal-tool-api"
          BASE="https://github.com/${REPO}/releases/download/v${V}"

          cat > dist/latest.json << EOF
          {
            "version": "${V}",
            "platforms": {
              "windows-amd64": {
                "url": "${BASE}/${APP}-v${V}.exe",
                "sha256": "${{ steps.sha.outputs.win_sha }}"
              },
              "linux-amd64": {
                "url": "${BASE}/${APP}-v${V}",
                "sha256": "${{ steps.sha.outputs.linux_sha }}"
              }
            }
          }
          EOF

          echo "Generated latest.json:"
          cat dist/latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "v${{ steps.sha.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/windows/${{ env.APP_NAME }}-v${{ steps.sha.outputs.version }}.exe
            dist/windows/updater.exe
            dist/linux/${{ env.APP_NAME }}-v${{ steps.sha.outputs.version }}
            dist/linux/updater
            dist/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
